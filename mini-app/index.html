<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMG Mini App</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .wallet { margin-bottom: 20px; }
        .tasks { border-top: 1px solid #ccc; padding-top: 20px; }
    </style>
</head>
<body>
    <h1>Welcome to the OMG Mini App!</h1>
    <div id="user-info"></div>

    <div class="wallet">
        <h2>Your Wallet</h2>
        <p>Balance: <span id="balance">...</span> coins</p>
    </div>

    <div class="tasks">
        <h2>Short Tasks</h2>
        <div id="tasks-list">
            <div class="task">
                <p>Task 1: Join our Telegram Channel (+100 coins)</p>
                <button class="task-btn" data-task-id="task1" data-reward="100">Complete Task</button>
            </div>
            <div class="task">
                <p>Task 2: Invite a friend (+500 coins)</p>
                <button class="task-btn" data-task-id="task2" data-reward="500">Complete Task</button>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
